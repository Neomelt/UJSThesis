name: build

on:
  push:
  pull_request:

jobs:
  latex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          latexmk_use_xelatex: true
          args: -halt-on-error -interaction=nonstopmode -file-line-error
      - uses: actions/upload-artifact@v4
        with:
          name: ujsthesis-pdf
          path: main.pdf
